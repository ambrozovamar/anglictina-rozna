<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outdoors – There's a / There are</title>
<!--
  3. ročník · Unit 1 Outdoors · hra na interaktivní tabuli (funguje offline, bez instalace)
  Metodická poznámka:
  - 5–8 min na jedno kolo, 2 týmy (Team A / Team B). Tým, který je na tahu, se rozsvítí.
  - K tabuli chodí vždy JEDEN hráč podle pevného pořadí (seznam jmen si napište na tabuli).
  - Fair play: bod platí jen tehdy, když ostatní z týmu mlčí – kdo napovídá nahlas, tým bod nedostane.
  - Režim 1 „Count & say“: dítě nahlas řekne celou větu (There are three trees.), učitel ťukne ✓ nebo ✗.
  - Režim 2 „There's or There are?“: dítě samo ťukne na správnou možnost.
  - Režim 3 „What's missing?“: třída zavře oči, jedna věc zmizí, hráč řekne, co chybí.
  - Slabší děti: smí říct jen slovo (trees) – za celou větu 2 body. Zdatní: musí říct i barvu nebo počet slovy.
-->
<style>
  :root { --a: #e8590c; --b: #1971c2; --ok: #2f9e44; --bad: #c92a2a; --bg: #f3f9ee; --ink: #1f2a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; }
  header { display: flex; align-items: stretch; gap: 12px; padding: 12px 16px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .team { flex: 1; display: flex; align-items: center; justify-content: space-between; border-radius: 18px; padding: 8px 20px; border: 5px solid transparent; font-size: 30px; font-weight: 800; }
  .team.a { color: var(--a); background: #fff0e6; }
  .team.b { color: var(--b); background: #e6f1fc; }
  .team.active.a { border-color: var(--a); }
  .team.active.b { border-color: var(--b); }
  .team .pts { font-size: 54px; min-width: 60px; text-align: right; }
  .team .turn { font-size: 16px; font-weight: 700; opacity: 0; }
  .team.active .turn { opacity: 1; }
  nav { display: flex; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 16px; }
  .mode { font-size: 22px; font-weight: 700; padding: 14px 22px; background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .mode.on { background: var(--ink); color: #fff; }
  .small { font-size: 18px; padding: 12px 16px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px 20px; gap: 18px; min-height: 0; }
  .scene { width: min(1100px, 100%); flex: 1; min-height: 260px; max-height: 52vh; background: #fff; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2vw; padding: 2vw; }
  .item { width: clamp(70px, 11vw, 150px); height: clamp(70px, 11vw, 150px); display: flex; align-items: center; justify-content: center; font-size: clamp(56px, 9vw, 130px); line-height: 1; transition: opacity .3s, transform .3s; }
  .item svg { width: 100%; height: 100%; }
  .item.gone { opacity: 0; transform: scale(.4); }
  .prompt { font-size: clamp(30px, 4.4vw, 60px); font-weight: 800; text-align: center; min-height: 1.3em; }
  .prompt .blank { display: inline-block; min-width: 3.2em; border-bottom: 6px solid currentColor; }
  .answer { color: var(--ok); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .big { font-size: clamp(26px, 3.4vw, 46px); font-weight: 800; padding: 18px 40px; min-width: 200px; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .green { background: var(--ok); } .red { background: var(--bad); } .grey { background: #495057; } .violet { background: #7048e8; }
  .flash { animation: flash .6s; }
  @keyframes flash { 0%,100% { background: #fff; } 40% { background: #d3f9d8; } }
  .flash-bad { animation: flashbad .6s; }
  @keyframes flashbad { 0%,100% { background: #fff; } 40% { background: #ffe3e3; } }
  .hint { font-size: 18px; color: #5c6b55; text-align: center; }
  .words { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .word { font-size: clamp(22px, 2.6vw, 34px); font-weight: 700; background: #fff; border-radius: 14px; padding: 8px 18px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
</style>
</head>
<body>
<header>
  <div class="team a active" id="tA"><span>Team A <span class="turn">◀ your turn</span></span><span class="pts" id="pA">0</span></div>
  <div class="team b" id="tB"><span>Team B <span class="turn">◀ your turn</span></span><span class="pts" id="pB">0</span></div>
</header>
<nav>
  <button class="mode on" data-mode="count">1 · Count &amp; say</button>
  <button class="mode" data-mode="isare">2 · There's or There are?</button>
  <button class="mode" data-mode="missing">3 · What's missing?</button>
  <span style="flex:1"></span>
  <button class="small" id="sound">🔊 Sound on</button>
  <button class="small" id="reset">↺ New game</button>
</nav>
<main id="main"></main>

<script>
// ---------- Slovní zásoba (Unit 1 Outdoors, sada 1 + 2) ----------
const SVG = {
  lake: '<svg viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="44" ry="24" fill="#4dabf7"/><ellipse cx="50" cy="58" rx="30" ry="12" fill="#a5d8ff"/><path d="M14 52 q4 -22 6 0 M20 50 q5 -26 6 0" stroke="#2f9e44" stroke-width="5" fill="none"/></svg>',
  river: '<svg viewBox="0 0 100 100"><path d="M-5 30 C 25 10, 45 50, 70 30 S 105 20, 105 20 L 105 50 C 80 55, 70 75, 45 60 S 10 55, -5 70 Z" fill="#4dabf7"/><path d="M10 50 q10 -6 20 0 M50 44 q10 -6 20 0" stroke="#d0ebff" stroke-width="4" fill="none"/></svg>',
  mountain: '<svg viewBox="0 0 100 100"><path d="M5 90 L40 20 L58 52 L70 36 L95 90 Z" fill="#868e96"/><path d="M40 20 L30 40 L40 36 L48 42 Z" fill="#fff"/></svg>',
};
const WORDS = {
  tree:     { icon: '🌳', plural: 'trees' },
  flower:   { icon: '🌼', plural: 'flowers' },
  bird:     { icon: '🐦', plural: 'birds' },
  house:    { icon: '🏠', plural: 'houses' },
  mountain: { svg: 'mountain', plural: 'mountains' },
  lake:     { svg: 'lake', plural: 'lakes' },
  tent:     { icon: '⛺', plural: 'tents' },
  boat:     { icon: '⛵', plural: 'boats' },
  fish:     { icon: '🐟', plural: 'fish' },
  river:    { svg: 'river', plural: 'rivers' },
};
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six'];
const KEYS = Object.keys(WORDS);
const art = (k) => WORDS[k].svg ? SVG[WORDS[k].svg] : WORDS[k].icon;
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rnd(arr.length)];
const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
// řeka a jezero se nepočítají po kusech (v knize jen „There's a lake / river“)
const COUNTABLE = KEYS.filter((k) => !['river', 'lake'].includes(k));

// ---------- Body a týmy ----------
let score = { A: 0, B: 0 }, turn = 'A', soundOn = true, mode = 'count';
const $ = (s) => document.querySelector(s);
function drawScore() {
  $('#pA').textContent = score.A; $('#pB').textContent = score.B;
  $('#tA').classList.toggle('active', turn === 'A'); $('#tB').classList.toggle('active', turn === 'B');
}
function nextTurn() { turn = turn === 'A' ? 'B' : 'A'; drawScore(); }
function point(n = 1) { score[turn] += n; drawScore(); }

// ---------- Zvuk (volitelný) ----------
let ctx;
function beep(ok) {
  if (!soundOn) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = ok ? 660 : 180;
  g.gain.setValueAtTime(0.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (ok ? 0.35 : 0.5));
  o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.5);
  if (ok) { const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.type = 'triangle'; o2.frequency.value = 880;
    g2.gain.setValueAtTime(0.2, ctx.currentTime + .12); g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + .5);
    o2.connect(g2).connect(ctx.destination); o2.start(ctx.currentTime + .12); o2.stop(ctx.currentTime + .55); }
}
function flash(ok) { const s = $('.scene'); if (!s) return; s.classList.remove('flash', 'flash-bad'); void s.offsetWidth; s.classList.add(ok ? 'flash' : 'flash-bad'); }

// ---------- Režim 1: Count & say ----------
function sentence(k, n) {
  if (n === 1) return `There's a ${k}.`;
  return `There are ${NUM[n]} ${WORDS[k].plural}.`;
}
function roundCount() {
  const k = pick(COUNTABLE), n = 1 + rnd(5);
  const items = Array.from({ length: n }, () => `<div class="item">${art(k)}</div>`).join('');
  $('#main').innerHTML = `
    <div class="scene">${items}</div>
    <div class="prompt" id="prompt">How many? <span class="blank"></span></div>
    <div class="row">
      <button class="big violet" id="show">👀 Show answer</button>
      <button class="big green" id="ok">✓ Correct</button>
      <button class="big red" id="no">✗ Try again</button>
    </div>
    <div class="hint">Say the whole sentence: “There's a … / There are …”</div>`;
  $('#show').onclick = () => { $('#prompt').innerHTML = `<span class="answer">${sentence(k, n)}</span>`; };
  $('#ok').onclick = () => { beep(true); flash(true); point(); nextTurn(); setTimeout(roundCount, 700); };
  $('#no').onclick = () => { beep(false); flash(false); $('#prompt').innerHTML = `<span class="answer">${sentence(k, n)}</span>`; nextTurn(); setTimeout(roundCount, 1800); };
}

// ---------- Režim 2: There's or There are? ----------
function roundIsAre() {
  const k = pick(KEYS);
  const n = COUNTABLE.includes(k) ? (Math.random() < 0.45 ? 1 : 2 + rnd(4)) : 1;
  const items = Array.from({ length: n }, () => `<div class="item">${art(k)}</div>`).join('');
  const tail = n === 1 ? `a ${k}.` : `${NUM[n]} ${WORDS[k].plural}.`;
  $('#main').innerHTML = `
    <div class="scene">${items}</div>
    <div class="prompt"><span class="blank"></span> ${tail}</div>
    <div class="row">
      <button class="big grey" data-a="1">There's</button>
      <button class="big grey" data-a="2">There are</button>
    </div>
    <div class="hint">Tap the right words. Then read the sentence aloud!</div>`;
  document.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => {
    const ok = (b.dataset.a === '1') === (n === 1);
    beep(ok); flash(ok);
    $('.prompt').innerHTML = `<span class="answer">${sentence(k, n)}</span>`;
    if (ok) point();
    nextTurn();
    setTimeout(roundIsAre, ok ? 1200 : 2000);
  });
}

// ---------- Režim 3: What's missing? ----------
function roundMissing() {
  const set = shuffle(KEYS).slice(0, 6);
  const gone = pick(set);
  $('#main').innerHTML = `
    <div class="scene">${set.map((k) => `<div class="item" data-k="${k}">${art(k)}</div>`).join('')}</div>
    <div class="words">${set.map((k) => `<span class="word">${k}</span>`).join('')}</div>
    <div class="row">
      <button class="big violet" id="hide">🙈 Close your eyes!</button>
    </div>
    <div class="hint">Look and remember. Then close your eyes!</div>`;
  $('#hide').onclick = () => {
    document.querySelector('.words').style.visibility = 'hidden';
    const el = document.querySelector(`[data-k="${gone}"]`);
    el.classList.add('gone');
    $('.row').innerHTML = `<button class="big violet" id="reveal">What's missing? 👀</button>
      <button class="big green" id="ok">✓ Correct</button><button class="big red" id="no">✗ No</button>`;
    $('.hint').textContent = 'Open your eyes! What\'s missing? Say: “The … is missing.” or just the word.';
    const reveal = () => { el.classList.remove('gone'); $('.hint').innerHTML = `<b class="answer" style="font-size:36px">The ${gone} is missing!</b>`; };
    $('#reveal').onclick = reveal;
    $('#ok').onclick = () => { beep(true); point(); reveal(); nextTurn(); setTimeout(roundMissing, 1500); };
    $('#no').onclick = () => { beep(false); reveal(); nextTurn(); setTimeout(roundMissing, 2200); };
  };
}

// ---------- Ovládání ----------
const MODES = { count: roundCount, isare: roundIsAre, missing: roundMissing };
document.querySelectorAll('.mode').forEach((b) => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach((x) => x.classList.toggle('on', x === b));
  MODES[mode]();
});
$('#tA').onclick = () => { turn = 'A'; drawScore(); };
$('#tB').onclick = () => { turn = 'B'; drawScore(); };
$('#sound').onclick = () => { soundOn = !soundOn; $('#sound').textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off'; };
$('#reset').onclick = () => { if (confirm('New game – reset points?')) { score = { A: 0, B: 0 }; turn = 'A'; drawScore(); MODES[mode](); } };
drawScore();
roundCount();
</script>
</body>
</html>
