<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>He can or She can</title>
<!--
  Metodická poznámka (pro učitele)
  4. ročník · Explore Together 2, Unit 1 Let's play · samostatná práce na počítačích (10–12 min), offline, myší i dotykem.
  Navazuje na reflexi 19. 10.: věty o někom jiném děti pletly („Amy I can play the piano“).
  Cíl: o druhém člověku říkáme jméno nebo He / She + can / can't + činnost (Amy can play the piano. / She can't skate.).
  ★ Level 1: podívej se na kartu (dítě + ✓ / ✗ + činnost) a poskládej větu ze tří částí. Nabídka obsahuje i chybné „I can“ –
    když ho dítě vybere, dostane vysvětlení „Amy = she → She can …, not I can“.
  ★★ Level 2: napiš větu sám (She can't ride a horse.) a pak odpověz na otázku Can he/she …? krátkou odpovědí.
  🤝 Podpora: tlačítko 💡 ukáže tabulku I can / He can / She can. Na konci počet hvězdiček – ruka nahoru, ukázat učiteli.
  Pokyny pro děti anglicky, britská angličtina, bez chráněných postav (jen jména a obrázky činností).
-->
<style>
  :root { --bg: #eef4fb; --ink: #17212b; --card: #fff; --line: #cfdcea; --accent: #1f6fd1; --ok: #2f8f4e; --bad: #c0392b; --he: #1e6fd9; --she: #c2185b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12171d; --ink: #e9eef4; --card: #1d252e; --line: #344250; } }
  :root[data-theme="dark"] { --bg: #12171d; --ink: #e9eef4; --card: #1d252e; --line: #344250; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 18px/1.3 "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: clamp(6px, 1.4vh, 12px) 16px; flex-wrap: wrap; }
  header h1 { font-size: clamp(18px, min(2.4vw, 4vh), 26px); margin: 0 auto 0 0; }
  .btn { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: clamp(6px, 1.2vh, 10px) 16px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stars { font-size: clamp(18px, min(2.4vw, 4vh), 26px); font-weight: 800; white-space: nowrap; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px); padding: 0 16px 16px; min-height: 0; }
  .card { width: min(760px, 100%); flex: 1 1 auto; min-height: 0; max-height: 34vh; background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    display: flex; align-items: center; justify-content: center; gap: min(4vw, 5vh); padding: min(2vw, 2.5vh); }
  .who { text-align: center; font-weight: 800; font-size: clamp(18px, min(2.6vw, 4.2vh), 30px); }
  .face { font-size: clamp(48px, min(10vw, 17vh), 130px); line-height: 1; }
  .act { font-size: clamp(48px, min(10vw, 17vh), 130px); line-height: 1; position: relative; }
  .mark { position: absolute; right: -.25em; bottom: -.15em; font-size: .5em; }
  .label { font-size: clamp(16px, min(2vw, 3.4vh), 24px); text-align: center; color: #5b6b7b; }
  .sentence { font-size: clamp(22px, min(3.8vw, 6.2vh), 46px); font-weight: 800; text-align: center; min-height: 1.3em; }
  .slot { display: inline-block; min-width: 2.6em; border-bottom: 5px solid currentColor; padding: 0 .15em; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .choice { font: inherit; font-size: clamp(18px, min(2.8vw, 4.6vh), 34px); font-weight: 800; padding: clamp(8px, 1.6vh, 14px) clamp(14px, 2.2vw, 28px); border-radius: 16px; border: 3px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .choice:hover { border-color: var(--accent); }
  .choice.ok { background: #d3f9d8; border-color: var(--ok); color: #1b5e20; }
  .choice.no { background: #ffe3e3; border-color: var(--bad); color: var(--bad); }
  .type { display: flex; gap: 10px; width: min(760px, 100%); }
  .type input { flex: 1; min-width: 0; font: inherit; font-size: clamp(20px, min(3vw, 5vh), 32px); padding: 10px 14px; border-radius: 14px; border: 3px solid var(--line); background: var(--card); color: var(--ink); }
  .msg { font-size: clamp(17px, min(2.4vw, 4vh), 28px); font-weight: 800; min-height: 1.3em; text-align: center; }
  .msg.ok { color: var(--ok); } .msg.no { color: var(--bad); }
  .hint { width: min(760px, 100%); background: #fff8e1; color: #5d4300; border-radius: 14px; padding: 10px 14px; font-size: clamp(15px, min(1.8vw, 3vh), 20px); display: none; }
  .hint.show { display: block; }
  .end { text-align: center; font-size: clamp(22px, min(3.5vw, 6vh), 40px); font-weight: 800; }
  @media (max-width: 600px) { body { height: auto; min-height: 100%; } .card { flex: none; min-height: 150px; } }
</style>
</head>
<body>
<header>
  <h1>🛹 He can or She can?</h1>
  <button class="btn on" data-level="1">★ Level 1</button>
  <button class="btn" data-level="2">★★ Level 2</button>
  <button class="btn" id="hintBtn">💡 Help</button>
  <span class="stars" id="stars">⭐ 0 / 10</span>
</header>
<main id="main"></main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const PEOPLE = [
    { name: 'Amy', face: '👧', he: 'She' }, { name: 'Paul', face: '👦', he: 'He' }, { name: 'Lucy', face: '👧', he: 'She' },
    { name: 'Mike', face: '👦', he: 'He' }, { name: 'Sophie', face: '👧', he: 'She' }, { name: 'Sam', face: '👦', he: 'He' },
  ];
  const ACTS = [
    ['skateboard', '🛹'], ['skate', '⛸️'], ['dive', '🤿'], ['paint', '🎨'], ['draw', '✏️'], ['ride a horse', '🏇'],
    ['play the drums', '🥁'], ['play the violin', '🎻'], ['play the piano', '🎹'], ['play the guitar', '🎸'], ['play football', '⚽'],
    ['play tennis', '🎾'], ['play basketball', '🏀'], ['ride a bike', '🚲'], ['rollerblade', '🛼'], ['swim', '🏊'], ['sing', '🎤'],
  ];
  const rnd = (n) => Math.floor(Math.random() * n);
  const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
  const ROUNDS = 10;
  let level = 1, round = 0, stars = 0, task = null, firstTry = true, tasks = [];

  function makeTasks() {
    const acts = shuffle(ACTS);
    return Array.from({ length: ROUNDS }, (_, i) => ({ p: PEOPLE[rnd(PEOPLE.length)], act: acts[i][0], icon: acts[i][1], can: i % 2 === 0 ? Math.random() < .7 : Math.random() < .3, useName: Math.random() < .5 }));
  }
  const updateStars = () => ($('#stars').textContent = `⭐ ${stars} / ${ROUNDS}`);
  const cardHtml = (t) => `<div class="card">
      <div><div class="face">${t.p.face}</div><div class="who">${t.p.name}</div></div>
      <div><div class="act">${t.icon}<span class="mark">${t.can ? '✅' : '❌'}</span></div><div class="label">${t.act}</div></div>
    </div>`;
  const hintHtml = `<div class="hint" id="hint">
      <b>I</b> can … (me) &nbsp;·&nbsp; <b style="color:var(--he)">He</b> / Paul can … &nbsp;·&nbsp; <b style="color:var(--she)">She</b> / Amy can …<br>
      ✅ <b>can</b> = umí &nbsp;·&nbsp; ❌ <b>can't</b> = neumí &nbsp;·&nbsp; ⚠️ Not „Amy I can“ → <b>Amy can</b> / <b>She can</b>.<br>
      Can she skate? → <b>Yes, she can.</b> / <b>No, she can't.</b></div>`;
  const want = (t) => `${t.useName ? t.p.name : t.p.he} ${t.can ? 'can' : "can't"} ${t.act}.`;

  function next() {
    if (round >= ROUNDS) return finish();
    task = tasks[round];
    firstTry = true;
    (level === 1 ? renderL1 : renderL2)();
  }

  // ★ Level 1: tři kroky – kdo, can/can't, činnost
  function renderL1() {
    const t = task;
    const subj = t.useName ? t.p.name : t.p.he;
    const other = t.p.he === 'He' ? 'She' : 'He';
    $('#main').innerHTML = `${cardHtml(t)}
      <div class="sentence"><span class="slot" id="s1">&nbsp;</span> <span class="slot" id="s2">&nbsp;</span> <span class="slot" id="s3">&nbsp;</span>.</div>
      <div class="choices" id="c"></div><div class="msg" id="msg">Who? Build the sentence about ${t.p.name}!</div>${hintHtml}`;
    const step = (opts, ok, slot, fail, then) => {
      $('#c').innerHTML = shuffle(opts).map((o) => `<button class="choice">${o}</button>`).join('');
      $('#c').onclick = (e) => {
        const b = e.target.closest('.choice');
        if (!b) return;
        if (b.textContent !== ok) return wrong(b, fail(b.textContent));
        $(slot).textContent = ok;
        then();
      };
    };
    step(t.useName ? [t.p.name, 'I', `${t.p.name} I`] : [t.p.he, other, 'I'], subj, '#s1',
      (x) => (x.includes('I') ? `${t.p.name} is not me! → ${t.useName ? t.p.name : t.p.he} can …` : `${t.p.name} is a ${t.p.he === 'He' ? 'boy → He' : 'girl → She'}.`),
      () => {
        $('#msg').textContent = 'Can or can’t? Look at ✅ / ❌';
        $('#msg').className = 'msg';
        step(['can', "can't", 'cans'], t.can ? 'can' : "can't", '#s2',
          (x) => (x === 'cans' ? 'Can never changes: she can, he can (no s!).' : t.can ? '✅ = can' : '❌ = can’t'),
          () => {
            $('#msg').textContent = 'What activity?';
            $('#msg').className = 'msg';
            const wrongActs = shuffle(ACTS.map((a) => a[0]).filter((a) => a !== t.act)).slice(0, 2);
            step([t.act, ...wrongActs], t.act, '#s3', () => 'Look at the picture again.', right);
          });
      });
  }

  // ★★ Level 2: napsat větu, pak krátká odpověď na otázku
  function renderL2() {
    const t = task;
    $('#main').innerHTML = `${cardHtml(t)}
      <form class="type" id="f"><input id="in" autocomplete="off" spellcheck="false" placeholder="Write about ${t.p.name}: ${t.p.he} can … / ${t.p.he} can't …"><button class="btn on">Check ✓</button></form>
      <div class="msg" id="msg">Write a sentence about ${t.p.name}.</div>${hintHtml}`;
    const inp = $('#in');
    inp.focus();
    const norm = (s) => s.toLowerCase().replace(/[’`´]/g, "'").replace(/cannot|can not/g, "can't").replace(/[.!?]/g, '').replace(/\s+/g, ' ').trim();
    $('#f').onsubmit = (e) => {
      e.preventDefault();
      const v = norm(inp.value);
      const okSubj = [t.p.name.toLowerCase(), t.p.he.toLowerCase()];
      const target = `${t.can ? 'can' : "can't"} ${t.act}`;
      const good = okSubj.some((s) => v === `${s} ${target}`);
      if (good) {
        inp.value = inp.value.trim().replace(/\.?$/, '.');
        inp.style.borderColor = 'var(--ok)';
        return ask();
      }
      let tip = 'Not yet – try again!';
      if (/ i can/.test(' ' + v) || v.startsWith('i ')) tip = `${t.p.name} is not me → ${t.p.he} can … (not I can)`;
      else if (/\bcans\b/.test(v)) tip = 'No s: she can, he can.';
      else if (t.can && v.includes("can't")) tip = '✅ = can';
      else if (!t.can && !v.includes("can't")) tip = '❌ = can’t';
      else if (!okSubj.some((s) => v.startsWith(s))) tip = `Start with ${t.p.name} or ${t.p.he}.`;
      else tip = `Check the activity: ${t.act}`;
      firstTry = false;
      $('#msg').textContent = tip;
      $('#msg').className = 'msg no';
      inp.style.borderColor = 'var(--bad)';
    };
    function ask() {
      const pr = t.p.he.toLowerCase();
      $('#msg').innerHTML = `Can ${pr} ${t.act}?`;
      $('#msg').className = 'msg';
      $('#f').outerHTML = `<div class="choices" id="c">${shuffle([`Yes, ${pr} can.`, `No, ${pr} can't.`, `Yes, I can.`]).map((o) => `<button class="choice">${o}</button>`).join('')}</div>`;
      $('#c').onclick = (e) => {
        const b = e.target.closest('.choice');
        if (!b) return;
        const ok = t.can ? `Yes, ${pr} can.` : `No, ${pr} can't.`;
        if (b.textContent !== ok) return wrong(b, b.textContent.includes(' I ') ? `The question is about ${t.p.name} → ${pr}` : (t.can ? '✅ → Yes' : '❌ → No'));
        b.classList.add('ok');
        right();
      };
    }
  }

  function wrong(btn, tip) {
    firstTry = false;
    btn.classList.add('no');
    setTimeout(() => btn.classList.remove('no'), 700);
    $('#msg').textContent = tip;
    $('#msg').className = 'msg no';
  }
  function right() {
    if (firstTry) stars++;
    updateStars();
    $('#msg').textContent = (firstTry ? '⭐ ' : '✓ ') + want(task) + ' Say it aloud!';
    $('#msg').className = 'msg ok';
    round++;
    setTimeout(next, 1800);
  }
  function finish() {
    $('#main').innerHTML = `<div class="end">🎉 Well done!<br>⭐ ${stars} / ${ROUNDS}<br><span style="font-size:.6em">Put your hand up and show your teacher.</span></div>
      <div class="choices"><button class="choice" id="again">🔁 Play again</button>${level === 1 ? '<button class="choice" id="up">★★ Try Level 2</button>' : ''}</div>`;
    $('#again').onclick = () => start(level);
    $('#up')?.addEventListener('click', () => start(2));
  }
  function start(l) {
    level = l; round = 0; stars = 0; tasks = makeTasks();
    document.querySelectorAll('[data-level]').forEach((b) => b.classList.toggle('on', Number(b.dataset.level) === l));
    updateStars();
    next();
  }
  document.querySelectorAll('[data-level]').forEach((b) => (b.onclick = () => start(Number(b.dataset.level))));
  $('#hintBtn').onclick = () => $('#hint')?.classList.toggle('show');
  start(1);
})();
</script>
</body>
</html>
