<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Explorers – Rocket Race</title>
<!--
  Metodická poznámka (pro učitele)
  4. ročník · Explore Together 2 · Space Explorers 1 (uč. s. 16–17, Class Audio 35; PS s. 12–13; metodika ET2 PDF s. 35–37).
  Hra na interaktivní tabuli pro 12 dětí: 2 týmy po 6 (Team Orange × Team Blue), 12 kol = každé dítě jde k tabuli jednou.
  Funguje offline, dotykem i myší; hlas čte věty britskou angličtinou (🔊, lze vypnout).
  Hraje se až po poslechu příběhu (nejlépe 2× Class Audio 35 s učebnicí) – hra ověřuje porozumění a vazby z Unit 1:
    1 Who's speaking? – kdo říká větu z příběhu (jako PS s. 12 cv. 2)
    2 Answer like an explorer – krátké odpovědi Yes, I can / No, I can't / Yes, I have / No, I haven't
    3 Story quiz – otázky z metodiky (What has the alien got? Has Mac got a camera? …)
    4 Make the sentence – ťukáním seřadit slova ve větě (rozšíření z metodiky, hodina 2)
  Každý typ přijde 3×, pořadí se míchá; týmy se střídají. Správně napoprvé = raketa týmu poletí o kus blíž k planetě.
  Chyba: hráč zkouší znovu (bez posunu rakety). Tým nenapovídá nahlas – fair play (jinak bod neplatí, rozhodne učitel ✋ tlačítkem).
  Po odpovědi učitel ťukne „Next player ▶“ – teprve pak jde k tabuli hráč druhého týmu.
  ★ Level 1: méně možností (2–3), kratší věty. ★★ Level 2: víc možností (4), delší věty – úroveň lze přepnout pro jednoho hráče
     (např. zdatná dívka, chlapec s hovorovou angličtinou) a pak zpět.
  🤝 Podpora: 💡 Help ukáže postavy s obrázky a tabulku Can … ? → Yes, I can. / Have you got … ? → Yes, I have.
  Vlastní grafika (emoji), žádné obrázky z učebnice; ukázky vět jsou krátké citace z příběhu pro práci ve třídě.
-->
<style>
  :root { --bg: #0b1640; --ink: #f1f5ff; --card: #17245c; --line: #2c3c86; --a: #ff922b; --b: #4dabf7; --ok: #51cf66; --bad: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(ellipse at 70% 0%, #26347a 0%, var(--bg) 60%); color: var(--ink); font: 18px/1.3 "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; user-select: none; }
  header { display: flex; align-items: center; gap: 8px; padding: clamp(6px, 1.2vh, 10px) 14px; flex-wrap: wrap; }
  header h1 { font-size: clamp(18px, min(2.4vw, 4vh), 26px); margin: 0 auto 0 0; }
  .btn { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: clamp(5px, 1vh, 9px) 14px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
  .btn.on { background: var(--ok); border-color: var(--ok); color: #0b1640; }
  .turn { font-weight: 800; border-radius: 14px; padding: 6px 12px; white-space: nowrap; font-size: clamp(16px, min(2.2vw, 3.8vh), 24px); }
  .turn.A { background: var(--a); color: #2b1300; } .turn.B { background: var(--b); color: #04203a; }
  .race { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 0 16px; }
  .race .lab { font-weight: 800; font-size: clamp(14px, min(1.8vw, 3vh), 20px); white-space: nowrap; }
  .lane { position: relative; height: clamp(34px, 6vh, 56px); border-radius: 30px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 2px, transparent 2px calc(100% / 6)); border: 2px dashed var(--line); }
  .rocket { position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(45deg); font-size: clamp(26px, 5vh, 46px); transition: left .9s cubic-bezier(.3, 1.4, .5, 1); }
  .goal { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: clamp(26px, 5vh, 46px); }
  .score { font-weight: 900; font-size: clamp(18px, min(2.4vw, 4vh), 28px); min-width: 2.6em; text-align: right; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: clamp(8px, 1.8vh, 16px); padding: 8px 14px 14px; min-height: 0; }
  .kind { font-size: clamp(14px, min(1.8vw, 3vh), 20px); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; opacity: .8; }
  .q { font-size: clamp(22px, min(3.6vw, 6vh), 46px); font-weight: 800; text-align: center; max-width: 1100px; }
  .bubble { background: #fff; color: #1b2240; border-radius: 28px; padding: clamp(10px, 2vh, 20px) clamp(18px, 3vw, 36px); position: relative; font-size: clamp(22px, min(3.6vw, 6vh), 46px); font-weight: 800; max-width: 1100px; text-align: center; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -18px; border: 12px solid transparent; border-top: 14px solid #fff; transform: translateX(-50%); }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1150px; }
  .choice { font: inherit; font-size: clamp(18px, min(2.8vw, 4.6vh), 34px); font-weight: 800; padding: clamp(8px, 1.4vh, 14px) clamp(14px, 2vw, 26px); border-radius: 18px; border: 3px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .choice .em { font-size: 1.4em; line-height: 1; }
  .choice:hover { border-color: var(--ok); }
  .choice.ok { background: #1f5130; border-color: var(--ok); }
  .choice.no { background: #5a1f28; border-color: var(--bad); }
  .choice.used { opacity: .25; pointer-events: none; }
  .build { min-height: 1.6em; font-size: clamp(22px, min(3.6vw, 6vh), 46px); font-weight: 800; border-bottom: 4px dashed var(--line); padding: 4px 18px; text-align: center; min-width: min(700px, 90vw); }
  .msg { font-size: clamp(18px, min(2.6vw, 4.2vh), 30px); font-weight: 800; min-height: 1.3em; text-align: center; }
  .msg.ok { color: var(--ok); } .msg.no { color: var(--bad); }
  .hint { width: min(1000px, 100%); background: #fff3bf; color: #4a3500; border-radius: 14px; padding: 8px 14px; font-size: clamp(14px, min(1.7vw, 2.8vh), 19px); display: none; text-align: center; }
  .hint.show { display: block; }
  .locked .choices:not(.nextrow), .locked .tools { pointer-events: none; }
  .nextp { background: var(--ok) !important; border-color: var(--ok) !important; color: #0b1640 !important; }
  .tools { display: flex; gap: 10px; }
  .end { text-align: center; font-size: clamp(22px, min(3.4vw, 6vh), 40px); font-weight: 800; }
  .end .big { font-size: clamp(50px, 10vh, 100px); }
  @media (max-width: 600px) { body { height: auto; min-height: 100%; } }
</style>
</head>
<body>
<header>
  <h1>🚀 Space Explorers – Rocket Race</h1>
  <span class="turn A" id="turn">Team Orange · Player 1</span>
  <button class="btn on" data-level="1">★ Level 1</button>
  <button class="btn" data-level="2">★★ Level 2</button>
  <button class="btn" id="hintBtn">💡 Help</button>
  <button class="btn" id="voiceBtn">🔊</button>
  <button class="btn" id="newBtn">↺ New game</button>
</header>
<div class="race">
  <span class="lab" style="color:var(--a)">🟠 Team Orange</span><div class="lane"><span class="goal">🪐</span><span class="rocket" id="rA">🚀</span></div><span class="score" id="sA">0 / 6</span>
  <span class="lab" style="color:var(--b)">🔵 Team Blue</span><div class="lane"><span class="goal">🪐</span><span class="rocket" id="rB">🚀</span></div><span class="score" id="sB">0 / 6</span>
</div>
<main id="main"></main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const rnd = (n) => Math.floor(Math.random() * n);
  const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
  const PLAYERS = 12; // 12 dětí = 2 týmy po 6
  const PEOPLE = { Sally: '👩‍✈️', Kitty: '👧', Jim: '👦', Mac: '🧑‍🔬', 'the alien': '👽' };

  // ---------- Úlohy (podle příběhu a metodiky) ----------
  // 1 Who's speaking?
  const SPEAK = [
    ['Can you see the planet, Kitty?', 'Sally'],
    ['Kitty, can you play football?', 'Jim'],
    ['Jim! No football, please.', 'Sally'],
    ['Have you got a map, Kitty?', 'Sally'],
    ["Yes, I … No! No, I haven't.", 'Mac'],
    ["Look! An alien! And it's got the camera.", 'Kitty'],
    ["I've got the camera. Thank you, Captain!", 'Mac'],
    ["Wait! I haven't got my football.", 'Jim'],
    ['The aliens have got your football! Look!', 'Kitty'],
    ["Let's go!", 'Sally'],
  ];
  // 2 Answer like an explorer (krátké odpovědi can / have got)
  const ANSWER = [
    ['Can you see the planet, Kitty?', 'Yes, I can.'],
    ['Kitty, can you play football?', "No, I can't."],
    ['Can you see aliens, Mac?', "No, I can't."],
    ['Have you got a map, Kitty?', 'Yes, I have.'],
    ['Have you got a pen and notebook, Jim?', 'Yes, I have.'],
    ['Have you got a camera, Mac?', "No, I haven't."],
    ['Have you got the football, Jim?', 'Yes, I have.'],
  ];
  const SHORT = ['Yes, I can.', "No, I can't.", 'Yes, I have.', "No, I haven't."];
  // 3 Story quiz (otázky z metodiky, hodina 1 a 2)
  const QUIZ = [
    { q: 'What can Kitty and Captain Sally see?', a: ['the planet', '🪐'], w: [['a football', '⚽'], ['a cat', '🐱'], ['a car', '🚗']] },
    { q: 'What has Jim got?', a: ['a pen and notebook', '🖊️📒'], w: [['a map', '🗺️'], ['a camera', '📷'], ['a skateboard', '🛹']] },
    { q: 'What has the alien got?', a: ['the camera', '📷'], w: [['the map', '🗺️'], ['a guitar', '🎸'], ['the notebook', '📒']] },
    { q: 'Has Mac got the camera at first?', a: ["No, he hasn't.", '❌'], w: [['Yes, he has.', '✅'], ['Yes, he can.', '✅'], ["No, he can't.", '❌']] },
    { q: 'Can the aliens play football?', a: ['Yes, they can.', '⚽'], w: [["No, they can't.", '❌'], ['Yes, they have.', '✅'], ["No, they haven't.", '❌']] },
    { q: "What's the name of the spaceship?", a: ['The Explorer', '🚀'], w: [['The Planet', '🪐'], ['The Captain', '👩‍✈️'], ['The Football', '⚽']] },
    { q: 'Who has got the map?', a: ['Kitty', PEOPLE.Kitty], w: [['Jim', PEOPLE.Jim], ['Mac', PEOPLE.Mac], ['the alien', PEOPLE['the alien']]] },
    { q: "Who has got Jim's football at the end?", a: ['the aliens', '👽👽'], w: [['Kitty', PEOPLE.Kitty], ['Sally', PEOPLE.Sally], ['Mac', PEOPLE.Mac]] },
    { q: 'Where is the spaceship?', a: ['on a planet', '🪐'], w: [['in a garden', '🌳'], ['on a boat', '⛵'], ['in a house', '🏠']] },
  ];
  // 4 Make the sentence (★ kratší věty, ★★ delší)
  const SENT1 = ["I've got the camera.", 'Can you see aliens?', 'Have you got a map?', "I can't play football.", "Let's explore the planet!"];
  const SENT2 = ["I haven't got my football.", 'Have you got a pen and notebook?', 'Can you see the planet, Kitty?', "We've got the information about this planet.", 'The aliens have got your football!'];

  // ---------- Hlas ----------
  let voiceOn = true, voice = null;
  const pickVoice = () => { const v = speechSynthesis.getVoices(); voice = v.find((x) => x.lang === 'en-GB') || v.find((x) => x.lang.startsWith('en')) || null; };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(t) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/…/g, ',')); if (voice) u.voice = voice; u.lang = 'en-GB'; u.rate = .9; speechSynthesis.speak(u);
  }

  // ---------- Stav hry ----------
  let level = 1, round = 0, firstTry = true, rounds = [], score = { A: 0, B: 0 };
  const team = () => (round % 2 === 0 ? 'A' : 'B');
  const teamName = (t) => (t === 'A' ? 'Team Orange' : 'Team Blue');
  // 12 kol: každý typ 3×, žádný typ dvakrát po sobě, položky se v jedné hře neopakují
  function makeRounds() {
    let kinds;
    do { kinds = shuffle([1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]); } while (kinds.some((k, i) => i && k === kinds[i - 1]));
    const pools = { 1: shuffle(SPEAK), 2: shuffle(ANSWER), 3: shuffle(QUIZ), 4: [shuffle(SENT1), shuffle(SENT2)] };
    let i4 = 0;
    return kinds.map((k) => (k === 4 ? { k, idx: i4++ } : { k, item: pools[k].pop() })).map((r) => (r.k === 4 ? { ...r, s1: pools[4][0][r.idx], s2: pools[4][1][r.idx] } : r));
  }
  function drawRace() {
    for (const t of ['A', 'B']) {
      $('#r' + t).style.left = `${6 + score[t] * (88 / 6)}%`;
      $('#s' + t).textContent = `${score[t]} / 6`;
    }
    const t = team();
    $('#turn').className = 'turn ' + t;
    $('#turn').textContent = round >= PLAYERS ? 'Mission complete!' : `${teamName(t)} · Player ${Math.floor(round / 2) + 1}`;
  }
  const help = `<div class="hint" id="hint">${Object.entries(PEOPLE).map(([n, e]) => `${e} ${n === 'Sally' ? 'Captain Sally' : n}`).join(' &nbsp; ')}
    <br><b>Can you …?</b> → Yes, I can. / No, I can't. &nbsp; · &nbsp; <b>Have you got …?</b> → Yes, I have. / No, I haven't.</div>`;
  function msg(t, cls = '') { $('#msg').textContent = t; $('#msg').className = 'msg ' + cls; }
  function wrong(el, tip) { firstTry = false; el.classList.add('no'); setTimeout(() => el.classList.remove('no'), 700); msg(tip, 'no'); speak('Try again!'); }
  function right(text) {
    const t = team();
    if (firstTry) score[t]++;
    drawRace();
    msg((firstTry ? '🚀 ' : '✓ ') + text, 'ok');
    speak(text);
    $('#main').classList.add('locked');
    const last = round + 1 >= PLAYERS;
    $('#main').insertAdjacentHTML('beforeend', `<div class="choices nextrow"><button class="choice nextp" id="nextP">${last ? 'Land on the planet 🪐' : `Next player (${teamName(t === 'A' ? 'B' : 'A')}) ▶`}</button>
      ${firstTry ? '<button class="choice" id="foul" title="Tým napovídal – bod neplatí">✋ No point</button>' : ''}</div>`);
    $('#nextP').onclick = () => { round++; next(); };
    $('#foul')?.addEventListener('click', (e) => { score[t]--; drawRace(); e.target.remove(); msg('No helping, please! No point this time.', 'no'); });
  }

  // 1 Who's speaking?
  function rWho(r) {
    const [line, who] = r.item;
    const names = level === 1 ? shuffle([who, ...shuffle(['Sally', 'Kitty', 'Jim', 'Mac'].filter((n) => n !== who)).slice(0, 2)]) : shuffle(['Sally', 'Kitty', 'Jim', 'Mac']);
    $('#main').innerHTML = `<div class="kind">🗨️ Who's speaking?</div>
      <div class="bubble">${line}</div><div style="height:6px"></div>
      <div class="choices" id="c">${names.map((n) => `<button class="choice" data-n="${n}"><span class="em">${PEOPLE[n]}</span>${n === 'Sally' ? 'Captain Sally' : n}</button>`).join('')}</div>
      <div class="msg" id="msg">Who says this in the story?</div>${help}`;
    speak(line);
    $('#c').onclick = (e) => {
      const b = e.target.closest('.choice'); if (!b) return;
      if (b.dataset.n !== who) return wrong(b, `Not ${b.dataset.n}. Think about the story!`);
      b.classList.add('ok'); right(`Yes! ${who === 'Sally' ? 'Captain Sally' : who} says: “${line}”`);
    };
  }
  // 2 Answer like an explorer
  function rAnswer(r) {
    const [q, a] = r.item;
    const same = a.includes('can') ? ['Yes, I can.', "No, I can't."] : ['Yes, I have.', "No, I haven't."];
    const opts = level === 1 ? same : shuffle(SHORT);
    $('#main').innerHTML = `<div class="kind">🧑‍🚀 Answer like an explorer</div>
      <div class="bubble">${q}</div><div style="height:6px"></div>
      <div class="choices" id="c">${opts.map((o) => `<button class="choice" data-a="${o}">${o}</button>`).join('')}</div>
      <div class="msg" id="msg">What's the answer in the story?</div>${help}`;
    speak(q);
    $('#c').onclick = (e) => {
      const b = e.target.closest('.choice'); if (!b) return;
      const v = b.dataset.a;
      if (v === a) { b.classList.add('ok'); return right(`${q} – ${a}`); }
      if ((v.includes('can') && a.includes('have')) || (v.includes('have') && a.includes('can'))) return wrong(b, a.includes('can') ? 'Can you …? → … I can / I can\'t.' : 'Have you got …? → … I have / I haven\'t.');
      wrong(b, 'Check the story – yes or no?');
    };
  }
  // 3 Story quiz
  function rQuiz(r) {
    const it = r.item;
    const opts = shuffle([it.a, ...shuffle(it.w).slice(0, level === 1 ? 2 : 3)]);
    $('#main').innerHTML = `<div class="kind">📖 Story quiz</div>
      <div class="q">${it.q}</div>
      <div class="choices" id="c">${opts.map(([t, e]) => `<button class="choice" data-t="${t}"><span class="em">${e}</span>${t}</button>`).join('')}</div>
      <div class="msg" id="msg">Choose the answer!</div>${help}`;
    speak(it.q);
    $('#c').onclick = (e) => {
      const b = e.target.closest('.choice'); if (!b) return;
      if (b.dataset.t !== it.a[0]) return wrong(b, 'Not quite. Look at the story again!');
      b.classList.add('ok'); right(`${it.q} – ${it.a[0][0].toUpperCase() + it.a[0].slice(1)}`);
    };
  }
  // 4 Make the sentence
  function rOrder(r) {
    const s = level === 1 ? r.s1 : r.s2;
    const words = s.split(' ');
    let tiles;
    do { tiles = shuffle(words.map((w, i) => ({ w, i }))); } while (tiles.every((t, i) => t.i === i));
    let pos = 0;
    $('#main').innerHTML = `<div class="kind">🧩 Make the sentence</div>
      <div class="build" id="b">&nbsp;</div>
      <div class="choices" id="c">${tiles.map((t) => `<button class="choice" data-i="${t.i}">${t.w}</button>`).join('')}</div>
      <div class="tools"><button class="btn" id="hear">🔊 Listen</button></div>
      <div class="msg" id="msg">Tap the words in the right order!</div>${help}`;
    $('#hear').onclick = () => speak(s);
    $('#c').onclick = (e) => {
      const b = e.target.closest('.choice'); if (!b || b.classList.contains('used')) return;
      // stejné slovo se může ve větě opakovat (např. got) – platí, když sedí text
      if (b.textContent !== words[pos]) return wrong(b, `Not yet. Which word comes next? (${pos + 1}. word)`);
      b.classList.add('used');
      pos++;
      $('#b').textContent = words.slice(0, pos).join(' ');
      if (pos === words.length) right(s);
    };
  }
  const RENDER = { 1: rWho, 2: rAnswer, 3: rQuiz, 4: rOrder };

  function next() {
    if (round >= PLAYERS) return finish();
    firstTry = true;
    $('#main').classList.remove('locked');
    drawRace();
    RENDER[rounds[round].k](rounds[round]);
  }
  function finish() {
    drawRace();
    $('#main').classList.remove('locked');
    const total = score.A + score.B;
    const win = score.A === score.B ? "It's a draw! 🤝" : `${teamName(score.A > score.B ? 'A' : 'B')} lands first! 🏆`;
    $('#main').innerHTML = `<div class="end"><div class="big">🪐👽⚽</div>
      ${win}<br>🟠 ${score.A} / 6 &nbsp; 🔵 ${score.B} / 6<br>
      <span style="font-size:.7em">Whole class: ${total} / ${PLAYERS} ${total === PLAYERS ? '– Perfect mission!' : ''}</span><br>
      <span style="font-size:.6em">Captain Sally says: “Let's go!”</span></div>
      <div class="choices"><button class="choice" id="again">🔁 New mission</button></div>`;
    speak(`${win.replace(/[^\w\s!',]/g, '')} Let's go!`);
    $('#again').onclick = start;
  }
  function start() {
    round = 0; score = { A: 0, B: 0 }; rounds = makeRounds();
    next();
  }
  document.querySelectorAll('[data-level]').forEach((b) => (b.onclick = () => {
    level = Number(b.dataset.level);
    document.querySelectorAll('[data-level]').forEach((x) => x.classList.toggle('on', x === b));
    if (round < PLAYERS && !$('#main').classList.contains('locked')) next(); // jinak platí pro dalšího hráče
  }));
  $('#hintBtn').onclick = () => $('#hint')?.classList.toggle('show');
  $('#voiceBtn').onclick = () => { voiceOn = !voiceOn; $('#voiceBtn').textContent = voiceOn ? '🔊' : '🔇'; if (!voiceOn) speechSynthesis.cancel(); };
  $('#newBtn').onclick = () => { if (confirm('New game?')) start(); };
  window.__space = { start, get state() { return { level, round, score, rounds, firstTry }; } };
  start();
})();
</script>
</body>
</html>
